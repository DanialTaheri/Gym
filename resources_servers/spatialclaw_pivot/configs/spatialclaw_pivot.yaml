spatialclaw_pivot_resources:
  resources_servers:
    spatialclaw_pivot:
      entrypoint: app.py
      domain: agent
      # SWE PivotRL uses a deliberately coarse operation-name verifier. This
      # equivalent setting credits alternative SpatialClaw code/arguments
      # that select the same ordered tool operations.
      python_call_comparison: names
      verified: false
      description: Single-decision multimodal PivotRL over exact SpatialClaw main-policy states.

spatialclaw_pivot_agent:
  responses_api_agents:
    tool_simulation_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: spatialclaw_pivot_resources
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: train
        type: train
        jsonl_fpath: ${oc.env:SPATIALCLAW_PIVOT_DATA_PATH,resources_servers/spatialclaw_pivot/data/train.jsonl}
        num_repeats: 1
        license: NVIDIA Internal Use Only, Do Not Distribute
      - name: example
        type: example
        jsonl_fpath: resources_servers/spatialclaw_pivot/data/example.jsonl
        num_repeats: 1
        license: NVIDIA Internal Use Only, Do Not Distribute
