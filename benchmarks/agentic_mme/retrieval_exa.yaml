# Overlay on benchmarks/agentic_mme/config.yaml: live web search through exa.
# Key read from the environment (EXA_API_KEY); fetch_webpage uses Jina Reader (JINA_API_KEY if set; anonymous otherwise is rate-limited).
# exa has no reverse image search, so google_lens_search is not offered.
agentic_mme_agent:
  responses_api_agents:
    agentic_mme_agent:
      retrieval:
        mode: live
        search_provider: exa
        exa_api_key: ${oc.env:EXA_API_KEY,""}
        jina_api_key: ${oc.env:JINA_API_KEY,""}
