# Overlay on benchmarks/agentic_mme/config.yaml: live web search through tavily.
# Key read from the environment (TAVILY_API_KEY); fetch_webpage uses keyless Jina Reader.
# tavily has no reverse image search, so google_lens_search is not offered.
agentic_mme_agent:
  responses_api_agents:
    agentic_mme_agent:
      retrieval:
        mode: live
        search_provider: tavily
        tavily_api_key: ${oc.env:TAVILY_API_KEY,""}
